<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            text-align: center;
            max-width: 600px;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-description {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-size: 16px;
        }
        .btn-home:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <div class="error-message">{{ message }}</div>
        <div class="error-description">
            {% if code == 404 %}
            お探しのページは見つかりませんでした。<br>
            URLをご確認ください。
            {% elif code == 500 %}
            申し訳ございません。<br>
            サーバーに問題が発生しました。<br>
            時間をおいてもう一度お試しください。
            {% elif code == 400 %}
            リクエストに問題があります。<br>
            入力内容をご確認ください。
            {% else %}
            エラーが発生しました。<br>
            ホームページに戻ってください。
            {% endif %}
        </div>
        <a href="/" class="btn btn-primary btn-home">ホームに戻る</a>
    </div>
</body>
</html>
